<div class="nb-wrap">
  <button
    type="button"
    class="nb-btn"
    [attr.data-pulse]="store.unreadPulse()"
    title="الإشعارات"
    (click)="togglePanel()"
  >
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
      stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9" />
      <path d="M13.73 21a2 2 0 0 1-3.46 0" />
    </svg>
    @if (store.unreadCount() > 0) {
      <span class="nb-badge">{{ store.unreadCount() > 99 ? '99+' : store.unreadCount() }}</span>
    }
  </button>

  @if (panelOpen()) {
  <div class="nb-panel">
    <div class="nb-panel-head">
      <span>الإشعارات</span>
      @if (store.unreadCount() > 0) {
        <button type="button" class="nb-mark-all" (click)="markAllRead()">تعليم الكل كمقروء</button>
      }
    </div>

    <div class="nb-list">
      @if (loading()) {
        <div class="nb-empty">جارٍ التحميل...</div>
      } @else if (items().length === 0) {
        <div class="nb-empty">لا توجد إشعارات</div>
      } @else {
        @for (item of items(); track item.id) {
          <button type="button" class="nb-item" [class.nb-item-unread]="!item.isRead" (click)="markRead(item)">
            <span class="nb-item-dot" [class.nb-item-dot-unread]="!item.isRead"></span>
            <span class="nb-item-body">
              <span class="nb-item-title">{{ item.title }}</span>
              <span class="nb-item-msg">{{ item.message }}</span>
              <span class="nb-item-meta">
                <span class="nb-item-type">{{ typeLabel(item.type) }}</span>
                <span>{{ formatTime(item.createdAt) }}</span>
              </span>
            </span>
          </button>
        }
      }
    </div>

    <button type="button" class="nb-view-all" (click)="viewAll()">عرض كل الإشعارات</button>
  </div>
  }
</div>
